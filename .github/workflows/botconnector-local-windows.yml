name: BotConnector Local PowerShell Runtime

on:
  push:
    branches: [botconnector-local]
    paths:
      - '.github/workflows/botconnector-local-windows.yml'
      - 'packages/botconnector-local/**'
      - 'src-tauri/build-utils/**'
      - 'src-tauri/plugins/tauri-plugin-llamacpp/**'
      - 'Makefile'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: botconnector-local-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-vulkan-runtime:
    name: Windows x64 Vulkan runtime
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Enable Windows long paths for Git
        shell: pwsh
        run: git config --system core.longpaths true

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Vulkan engine toolchain
        uses: ./.github/actions/setup-engine-toolchain
        with:
          variant: vulkan

      - name: Verify engine toolchain
        shell: bash
        run: |
          ninja --version
          clang --version | head -1
          glslc --version | head -1

      - name: Build Vulkan worker only
        shell: bash
        env:
          JAN_ENGINE_VARIANT: vulkan
          JAN_ENGINE_REQUIRE_SIGNING: '0'
          CARGO_TARGET_DIR: D:/e
          JAN_ENGINE_BUILD_LOG: D:/a/BotConnector-Local/BotConnector-Local/engine-build.log
        run: |
          make build-engine
          test -f src-tauri/resources/bin/jan-llama-worker.exe

      - name: Stage BotConnector Local npm package
        shell: pwsh
        run: |
          $runtime = 'packages/botconnector-local/runtime/win32-x64-vulkan'
          New-Item -ItemType Directory -Force -Path $runtime | Out-Null
          Copy-Item src-tauri/resources/bin/* $runtime -Force
          Copy-Item LICENSE packages/botconnector-local/LICENSE -Force
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          node packages/botconnector-local/bin/botconnector-local.mjs --runtime-check
          Push-Location packages/botconnector-local
          $tgz = npm pack --pack-destination ../../dist
          Pop-Location
          Write-Host "Package: $tgz"
          Get-ChildItem dist | Select-Object Name,Length | Format-Table -AutoSize

      - name: Upload PowerShell/NPM runtime
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: botconnector-local-powershell-win-x64-vulkan
          path: dist/*.tgz
          if-no-files-found: error
          retention-days: 14

      - name: Upload engine log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: botconnector-local-engine-build-log
          path: engine-build.log
          if-no-files-found: ignore
