name: BotConnector Local Windows Baseline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-vulkan:
    name: Windows x64 Vulkan
    runs-on: windows-2025
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Enable Windows long paths for Git
        shell: pwsh
        run: git config --system core.longpaths true

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Yarn
        shell: pwsh
        run: |
          corepack enable
          corepack prepare yarn@4.5.3 --activate
          yarn --version

      - name: Install dependencies
        shell: pwsh
        run: yarn install --immutable

      - name: Setup llama.cpp Vulkan toolchain
        uses: ./.github/actions/setup-engine-toolchain
        with:
          variant: vulkan

      - name: Install pinned Ninja
        shell: pwsh
        run: |
          $version = '1.13.2'
          $url = "https://github.com/ninja-build/ninja/releases/download/v$version/ninja-win.zip"
          $expected = '07fc8261b42b20e71d1720b39068c2e14ffcee6396b76fb7a795fb460b78dc65'
          $zip = Join-Path $env:RUNNER_TEMP 'ninja-win.zip'
          $dest = 'C:\ninja'
          Invoke-WebRequest -Uri $url -OutFile $zip
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Ninja SHA256 mismatch: $actual"
          }
          Remove-Item $dest -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          if (-not (Test-Path "$dest\ninja.exe")) {
            throw 'Pinned Ninja executable missing after extraction'
          }
          $dest | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$dest\ninja.exe" --version

      - name: Build Windows app
        shell: bash
        env:
          JAN_ENGINE_VARIANT: vulkan
          JAN_ENGINE_REQUIRE_SIGNING: '0'
        run: |
          export PATH="/c/ninja:$PATH"
          echo "ninja=$(command -v ninja)"
          ninja --version
          make build

      - name: Record artifact sizes
        if: success()
        shell: pwsh
        run: |
          Write-Host '=== NSIS ==='
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe -ErrorAction SilentlyContinue |
            Select-Object Name,Length | Format-Table -AutoSize
          Write-Host '=== MSI ==='
          Get-ChildItem src-tauri/target/release/bundle/msi/*.msi -ErrorAction SilentlyContinue |
            Select-Object Name,Length | Format-Table -AutoSize
          Write-Host '=== MAIN EXE ==='
          Get-ChildItem src-tauri/target/release/*.exe -ErrorAction SilentlyContinue |
            Select-Object Name,Length | Format-Table -AutoSize

      - name: Upload engine log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: engine-build-log-windows-vulkan
          path: src-tauri/target/engine-build.log
          if-no-files-found: ignore

      - name: Upload Windows installers
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: botconnector-local-windows-vulkan
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14
