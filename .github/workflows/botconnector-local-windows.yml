name: BotConnector Local Windows Baseline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-vulkan:
    name: Windows x64 Vulkan
    runs-on: windows-2025
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Enable Windows long paths for Git
        shell: pwsh
        run: git config --system core.longpaths true

      - name: Ensure Ninja path for CMake
        shell: pwsh
        run: |
          $target = 'C:\ProgramData\chocolatey\bin\ninja.exe'
          if (-not (Test-Path $target)) {
            $src = (Get-Command ninja.exe -ErrorAction SilentlyContinue).Source
            if (-not $src) {
              choco install ninja -y --no-progress
            } else {
              New-Item -ItemType Directory -Force -Path (Split-Path $target) | Out-Null
              Copy-Item $src $target -Force
            }
          }
          if (-not (Test-Path $target)) { throw "Ninja not found at expected path: $target" }
          & $target --version
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Yarn
        shell: pwsh
        run: |
          corepack enable
          corepack prepare yarn@4.5.3 --activate
          yarn --version

      - name: Install dependencies
        shell: pwsh
        run: yarn install --immutable

      - name: Setup llama.cpp Vulkan toolchain
        uses: ./.github/actions/setup-engine-toolchain
        with:
          variant: vulkan

      - name: Normalize Ninja path for CMake
        shell: pwsh
        run: |
          $ninja = (Get-Command ninja.exe -ErrorAction Stop).Source
          $targetDir = 'C:\ProgramData\chocolatey\bin'
          New-Item -ItemType Directory -Force -Path $targetDir | Out-Null
          $target = Join-Path $targetDir 'ninja.exe'
          if (-not (Test-Path $target)) {
            Copy-Item -Force $ninja $target
          }
          & $target --version
      - name: Build Windows app
        shell: bash
        env:
          JAN_ENGINE_VARIANT: vulkan
          JAN_ENGINE_REQUIRE_SIGNING: '0'
        run: make build

      - name: Record artifact sizes
        if: success()
        shell: pwsh
        run: |
          Write-Host '=== NSIS ==='
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe -ErrorAction SilentlyContinue |
            Select-Object Name,Length | Format-Table -AutoSize
          Write-Host '=== MSI ==='
          Get-ChildItem src-tauri/target/release/bundle/msi/*.msi -ErrorAction SilentlyContinue |
            Select-Object Name,Length | Format-Table -AutoSize
          Write-Host '=== MAIN EXE ==='
          Get-ChildItem src-tauri/target/release/*.exe -ErrorAction SilentlyContinue |
            Select-Object Name,Length | Format-Table -AutoSize

      - name: Upload engine log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: engine-build-log-windows-vulkan
          path: src-tauri/target/engine-build.log
          if-no-files-found: ignore

      - name: Upload Windows installers
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: botconnector-local-windows-vulkan
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14
